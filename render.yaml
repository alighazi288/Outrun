# Render Blueprint: three free services.
#   outrun-dashboard  the public frontend link: the dashboard, with the Eaton replay built in.
#                     Its replay mode never depends on the two APIs below.
#   outrun-api        the Eaton night in manager mode (Orchestrate agents and the dashboard call it)
#   outrun-live       live mode: any US area on today's data
# Python version comes from .python-version; dependencies from uv.lock. Free web services sleep
# after 15 min idle; the first request wakes them (~1 min).
services:
  - type: web
    name: outrun-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-dev outrun-api
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # redeploy on every push to main, once CI is green
    envVars:
      - key: OUTRUN_DATASET
        value: eaton                # the real Eaton dataset (all inputs real; ~215 MB peak memory)
      - key: OUTRUN_APPROVAL
        value: manager              # plans wait for the manager's decision

  - type: web
    name: outrun-live
    runtime: python
    plan: free
    region: oregon
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-dev outrun-live
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:                    
      - key: FIRMS_MAP_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
    # Areas are set up on demand into data/live/ on the service's own disk. A free service's
    # disk is wiped on every deploy or restart: the picker sets an area up again in about 10-20 s.

  - type: web
    name: outrun-dashboard
    runtime: static
    rootDir: dashboard
    # A plain static build: unpack the saved Eaton replay (made with `make replay-bundle`), then
    # build the page. No Python here.
    buildCommand: mkdir -p public && tar -xzf replay.tar.gz -C public && npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL           # the two services above
        value: https://outrun-api.onrender.com
      - key: VITE_LIVE_URL
        value: https://outrun-live.onrender.com
