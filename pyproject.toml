[project]
name = "outrun"
version = "0.1.0"
description = "AI evacuation dispatch for people who can't outrun a wildfire."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "h3>=4.1",
]

[project.optional-dependencies]
# Install only what your card needs, e.g. `uv sync --group dev --extra routing`.
routing = ["ortools>=9.10", "osmnx>=2.0", "networkx>=3.3"]         
geo = ["geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "duckdb>=1.0", "pyarrow>=16", "pandas>=2.2"]
wx = ["herbie-data>=2024.8", "xarray>=2024.6"]                        
eval = ["pandas>=2.2", "matplotlib>=3.9"]                              

[project.scripts]
outrun-api = "backend.api.main:run"
outrun-export = "backend.export:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "engines", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "engines", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
